name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      USER_API_KEY: ci-local-token
      GEMINI_API_KEY: ci-placeholder-key
      DEFAULT_GOOGLE_MODEL: gemini-2.5-flash-lite
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked

      - name: Prepare local configuration
        run: cp env.example .env

      - name: Check formatting
        run: uv run black --check multimodal_moderation evals tests

      - name: Check import order
        run: uv run isort --check-only multimodal_moderation evals tests

      - name: Run non-integration tests
        run: uv run pytest tests -m "not integration" -vv
